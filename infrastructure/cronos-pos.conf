# ==============================================================
# Cronos POS — Nginx Reverse Proxy (Host)
# Archivo: /etc/nginx/sites-available/cronos-pos.conf
# Dominio: Reemplazar TU_DOMINIO.com con el dominio real
# ==============================================================

# Redireccion HTTP → HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name TU_DOMINIO.com www.TU_DOMINIO.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    location / {
        return 301 https://$server_name$request_uri;
    }
}

# Servidor HTTPS principal
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name TU_DOMINIO.com www.TU_DOMINIO.com;

    # --- Certificados SSL (Certbot / Let's Encrypt) ---
    ssl_certificate /etc/letsencrypt/live/TU_DOMINIO.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/TU_DOMINIO.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # --- Cabeceras de seguridad (Fase 9) ---
    # NO se inyectan aqui a proposito. Cada upstream es dueño de las suyas:
    #
    #   /api, /sanctum, /storage -> App\Http\Middleware\SecurityHeaders (Laravel)
    #   /                        -> frontend/nginx.conf (contenedor de la SPA)
    #
    # Un `add_header` a nivel server duplicaria cada cabecera sobre la
    # respuesta del upstream: el navegador recibiria dos Content-Security-Policy
    # y aplicaria la INTERSECCION de ambas, rompiendo Turnstile o el agente
    # local de impresion en cuanto las dos politicas divergieran.
    #
    # Si algun dia se sirve contenido directamente desde este Nginx (sin
    # proxy_pass), añadir el bloque de cabeceras dentro de ESE location.

    # --- Limites de carga (imagenes de producto) ---
    client_max_body_size 10M;

    # --- Bloque 1: API Laravel (/api) ---
    location /api {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }

    # --- Bloque 2: Laravel Sanctum CSRF cookie ---
    location /sanctum {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Bloque 3: Storage publico (imagenes producto) ---
    location /storage {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        expires 7d;
        add_header Cache-Control "public";
    }

    # --- Bloque 4: WebSockets Reverb (/app, /apps) ---
    location /app {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    location /apps {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # --- Bloque 5: Frontend SPA React (raiz) ---
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
