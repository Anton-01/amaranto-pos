# ==============================================================
# Cronos POS — Docker Production
# ==============================================================
x-backend-service: &backend-service
  build:
    context: .
    dockerfile: backend/Dockerfile.prod
  image: cronos-backend:latest
  restart: always
  env_file:
    - .env.production
  environment:
    TZ: America/Mexico_City
    APP_TIMEZONE: America/Mexico_City
    REVERB_HOST: reverb
    REVERB_PORT: 8080
    REVERB_SCHEME: http
  depends_on:
    redis:
      condition: service_healthy
  networks:
    - cronos-network

services:
  backend:
    <<: *backend-service
    container_name: cronos-backend
    command: php artisan serve --host=0.0.0.0 --port=8000
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "php artisan about > /dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  reverb:
    <<: *backend-service
    container_name: cronos-reverb
    command: php artisan reverb:start --host=0.0.0.0 --port=8080
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "php -r \"exit(@fsockopen('127.0.0.1', 8080) ? 0 : 1);\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  scheduler:
    <<: *backend-service
    container_name: cronos-scheduler
    entrypoint: [ "php" ]
    command: [ "artisan", "schedule:work" ]

  queue-worker:
    <<: *backend-service
    container_name: cronos-queue-worker
    entrypoint: [ "php" ]
    command: [ "artisan", "queue:work", "--tries=3", "--timeout=90" ]

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile.prod
    container_name: cronos-frontend
    restart: always
    ports:
      - "127.0.0.1:3000:80"
    depends_on:
      - backend
    networks:
      - cronos-network

  redis:
    image: redis:7-alpine
    container_name: cronos-redis
    restart: always
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cronos-network

volumes:
  redis-data:

networks:
  cronos-network:
    driver: bridge
