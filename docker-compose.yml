services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: cronos-backend
    ports:
      - "8000:8000"
      - "8080:8080"
    volumes:
      - ./backend:/var/www/html
      - backend-vendor:/var/www/html/vendor
    environment:
      # Unico contenedor que instala dependencias, escribe .env y corre
      # migraciones/seeders. Ver el encabezado de backend/docker-entrypoint.sh.
      - CONTAINER_ROLE=app
      # Reloj del SO del contenedor en hora del negocio. Sin esto la imagen
      # Alpine corre en UTC y `date`, los logs y cualquier binario ajeno a
      # PHP reportan 6 h adelantadas. Ver CONTEXT.md seccion 53.
      - TZ=America/Mexico_City
      # Zona de Laravel (config/app.php -> date_default_timezone_set).
      # Se declara junto al TZ del SO para que ambas capas no puedan
      # divergir en silencio.
      - APP_TIMEZONE=America/Mexico_City
      - APP_NAME=Cronos POS
      - APP_ENV=local
      - APP_DEBUG=true
      - APP_URL=http://localhost:8000
      - DB_CONNECTION=pgsql
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_DATABASE=cronos_pos
      - DB_USERNAME=cronos
      - DB_PASSWORD=cronos_secret
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - CACHE_STORE=redis
      - QUEUE_CONNECTION=redis
      - SESSION_DRIVER=redis
      - BROADCAST_CONNECTION=reverb
      - REVERB_APP_ID=cronos-local
      - REVERB_APP_KEY=cronos-reverb-key
      - REVERB_APP_SECRET=cronos-reverb-secret
      - REVERB_HOST=0.0.0.0
      - REVERB_PORT=8080
      - MAIL_MAILER=log
      - MAIL_FROM_ADDRESS=no-reply@cronos.pos
      - MAIL_FROM_NAME=Cronos POS
      # Datos de demostracion (catalogo + tickets de prueba) al sembrar.
      - SEED_DEMO_DATA=true
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # El servidor HTTP solo responde DESPUES de composer install, .env,
    # migraciones y seeders: por eso este healthcheck es la señal que usan
    # scheduler y queue-worker para saber que el arranque compartido termino.
    healthcheck:
      test: ["CMD-SHELL", "php -r \"exit(@file_get_contents('http://127.0.0.1:8000/up') === false ? 1 : 0);\""]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 180s
    networks:
      - cronos-network

  scheduler:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: cronos-scheduler-dev
    command: php artisan schedule:work
    volumes:
      - ./backend:/var/www/html
      - backend-vendor:/var/www/html/vendor
    environment:
      - CONTAINER_ROLE=worker
      # Reloj del SO del contenedor en hora del negocio. Sin esto la imagen
      # Alpine corre en UTC y `date`, los logs y cualquier binario ajeno a
      # PHP reportan 6 h adelantadas. Ver CONTEXT.md seccion 53.
      - TZ=America/Mexico_City
      # Zona de Laravel (config/app.php -> date_default_timezone_set).
      # Se declara junto al TZ del SO para que ambas capas no puedan
      # divergir en silencio.
      - APP_TIMEZONE=America/Mexico_City
      - APP_NAME=Cronos POS
      - APP_ENV=local
      - APP_DEBUG=true
      - APP_URL=http://localhost:8000
      - DB_CONNECTION=pgsql
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_DATABASE=cronos_pos
      - DB_USERNAME=cronos
      - DB_PASSWORD=cronos_secret
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - CACHE_STORE=redis
      - QUEUE_CONNECTION=redis
      - SESSION_DRIVER=redis
      - MAIL_MAILER=log
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      # Arranca solo cuando `backend` ya instalo dependencias y migro la base.
      backend:
        condition: service_healthy
    networks:
      - cronos-network

  queue-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: cronos-queue-worker-dev
    command: php artisan queue:work --tries=3 --timeout=90
    volumes:
      - ./backend:/var/www/html
      - backend-vendor:/var/www/html/vendor
    environment:
      - CONTAINER_ROLE=worker
      # Reloj del SO del contenedor en hora del negocio. Sin esto la imagen
      # Alpine corre en UTC y `date`, los logs y cualquier binario ajeno a
      # PHP reportan 6 h adelantadas. Ver CONTEXT.md seccion 53.
      - TZ=America/Mexico_City
      # Zona de Laravel (config/app.php -> date_default_timezone_set).
      # Se declara junto al TZ del SO para que ambas capas no puedan
      # divergir en silencio.
      - APP_TIMEZONE=America/Mexico_City
      - APP_NAME=Cronos POS
      - APP_ENV=local
      - APP_DEBUG=true
      - APP_URL=http://localhost:8000
      - DB_CONNECTION=pgsql
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_DATABASE=cronos_pos
      - DB_USERNAME=cronos
      - DB_PASSWORD=cronos_secret
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - CACHE_STORE=redis
      - QUEUE_CONNECTION=redis
      - SESSION_DRIVER=redis
      - MAIL_MAILER=log
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      # Arranca solo cuando `backend` ya instalo dependencias y migro la base.
      backend:
        condition: service_healthy
    networks:
      - cronos-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: cronos-frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules
    environment:
      - VITE_API_URL=http://backend:8000
    depends_on:
      - backend
    networks:
      - cronos-network

  postgres:
    image: postgres:16-alpine
    container_name: cronos-postgres
    ports:
      - "5432:5432"
    # `TZ` solo ajusta el reloj del SO del contenedor; el parametro `timezone`
    # del servidor lo fija initdb la PRIMERA vez y queda escrito en
    # postgresql.conf, de modo que un volumen ya creado seguiria en UTC. Por eso
    # se fuerza tambien por linea de comandos: asi el servidor arranca en hora
    # local aunque `postgres-data` venga de antes de esta correccion.
    # (En produccion no aplica: la Managed PostgreSQL de DigitalOcean corre en
    # UTC y se alinea por sesion desde config/database.php — seccion 47.)
    command: >
      postgres
      -c timezone=America/Mexico_City
      -c log_timezone=America/Mexico_City
    environment:
      - POSTGRES_DB=cronos_pos
      - POSTGRES_USER=cronos
      - POSTGRES_PASSWORD=cronos_secret
      - TZ=America/Mexico_City
      # Zona del CLIENTE libpq (psql, pg_dump dentro del contenedor).
      - PGTZ=America/Mexico_City
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cronos -d cronos_pos"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - cronos-network

  redis:
    image: redis:7-alpine
    container_name: cronos-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - cronos-network

volumes:
  postgres-data:
  redis-data:
  backend-vendor:
  frontend-node-modules:

networks:
  cronos-network:
    driver: bridge