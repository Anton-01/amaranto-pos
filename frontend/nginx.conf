server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ==============================================================
    # Escudo de Cabeceras de Seguridad — Fase 9
    # --------------------------------------------------------------
    # Este contenedor sirve el DOCUMENTO HTML de la SPA, asi que es
    # aqui donde la CSP protege de verdad al navegador (la CSP que
    # emite Laravel solo viaja en respuestas JSON de /api).
    #
    # FUENTE UNICA DE VERDAD: el Nginx del host NO debe volver a
    # inyectar estas cabeceras con add_header, o el navegador recibiria
    # dos CSP y aplicaria la interseccion de ambas.
    #
    # `always` es obligatorio: sin el, las cabeceras se pierden en las
    # respuestas de error (404 del fallback de la SPA, 5xx).
    # ==============================================================
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
    add_header X-Permitted-Cross-Domain-Policies "none" always;

    # Content Security Policy calibrada para el stack real del POS:
    #   script-src   -> bundle propio de Vite + widget de Cloudflare Turnstile.
    #   style-src    -> 'unsafe-inline' es INEVITABLE: Tailwind v4 y PrimeReact
    #                   escriben estilos en linea en tiempo de ejecucion.
    #   connect-src  -> API de mismo origen, Turnstile, el Cronos POS Agent
    #                   local (impresion ESC/POS) y el WebSocket de Reverb.
    #   frame-src    -> iframe del reto Turnstile + iframe srcDoc del visor
    #                   de plantillas de correo ('self').
    #   frame-ancestors 'none' -> equivalente moderno de X-Frame-Options DENY.
    #
    # Endurecimiento opcional: sustituir `ws: wss:` por `wss://TU_DOMINIO.com`
    # para fijar el WebSocket de Reverb a un unico origen.
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'; script-src 'self' https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https://challenges.cloudflare.com http://127.0.0.1:9100 http://localhost:9100 ws: wss:; frame-src 'self' https://challenges.cloudflare.com; worker-src 'self' blob:; manifest-src 'self'" always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        access_log off;

        # OJO: un add_header dentro de un location DESCARTA todos los
        # add_header heredados del nivel server. Por eso el bloque de
        # seguridad se repite aqui (los assets estaticos no necesitan CSP).
        add_header Cache-Control "public, immutable" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 256;
}
